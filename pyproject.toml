[project]
name = "aerial-mosaic"
version = "1.0.0"
description = "Cloud-free aerial mosaic compositor with per-pixel provenance"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "python-multipart>=0.0.20,<1",
    "pillow>=11,<14",
    "jinja2>=3.1,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
